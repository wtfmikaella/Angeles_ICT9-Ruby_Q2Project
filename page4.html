  <link href="styles.css" rel="stylesheet">
  <style>
    .nav-link {
  color: #004682 !important;
}

   .bg-blur {
  position: fixed;
  width: 100%;
  height: 100%;
  background-image: url("obfly.jpg");
  background-position: center;
  background-repeat: no-repeat;
  filter: blur(2px);
  z-index: -1; 
}

.enrollnowsign h1{
    font-size: 3.5rem;  
      font-family: 'Verdana';
      font-weight: 1000;
      color: #004682;
      margin-top: 0;
      line-height: 1.6;
      text-align: center;
}

.enrollnowsign p{
  text-align: center;
  color: black;
  margin: -1;
  position: relative;
  top:-25px;
}

 .enroll {
      background-color: rgba(255, 255, 255, 0.9);
      max-width: 900px;
      max-height: 250px;
      margin: 50px auto; 
      padding: 30px;
      border-radius: 13px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      align-items: center;
    }

    .enroll h3{
          text-align: center;
         color: #004682;
         margin: 1;
         position: relative;
         top: -10px;
          font-size: 2rem;
          font-weight: 700;
    }

    .fname{
        text-align: center;
    }
    .lname{
        text-align: center;
    }
    .bday{
        text-align: center;
        position: relative;
        left: 350px;
        top: -125px;
    }
    .gender{
        text-align: center;
        position: relative;
        left: 310px;
        top: -135px;
    }
    .glselect {
          text-align: center;
        position: relative;
        left: 320px;
        top: -145px;
    }
    .bttn{
        display: block;
      margin: 1px auto 0;
      padding: 2px 2px;
      font-size: 6px;
      border: none;
      border-radius: 89px;
      background: #004682;
      color: white;
      cursor: pointer;
      position: relative;
      top: -125px;
      right: -190px;
    }
  </style> 
</head>
<body>

<br>

<div class="enrollnowsign">
    <h1>Enroll Now</h1>
    <p>Please fill in the details below to enroll.</p>
</div>

<div class="enroll">
        <h3>Student Information</h3>    
        <br>  
    <form>
        <div class="fname">
          <label>First Name:</label>
          <input type="text" placeholder="Mika" required />
        </div><br>
        <div class="lname">
          <label>Last Name: </label>
          <input type="text" placeholder="Genove" required />
        </div>
        <br>
        <div class="bday">
          <label>Birth Date</label>
          <input type="date" required />
        </div>
        <br>
        <div class="gender">
          <label>Gender</label>
          <select required>
            <option value="">Select...</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
        <br>
        <div class="glselect">
          <label>Grade Level</label>
          <select required>
            <option value="">Select...</option>
            <option>Grade 7</option>
            <option>Grade 8</option>
            <option>Grade 9</option>
            <option>Grade 10</option>
            <option>Grade 11</option>
            <option>Grade 12</option>
          </select>
        </div>
        <div class="bttn">
         <button type="submit" class="btn btn-send w-100">Submit</button>
         </div>
    </form>
    </div>
</div>


</body>
</html>
